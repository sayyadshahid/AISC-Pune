<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="submit()">submit</button>
    <p id="result"></p>
    <script>
        function Car(brand, year){
            this.brand = brand;
            this.year = year;
        }
        Car.prototype.getDetails = function(){
            return `${this.year} and ${this.brand}`;
        }
        
        function submit (){
            const c1 = new Car("yes", 90);
            document.getElementById("result").textContent = c1.getDetails();
        }

    </script>
</body>
</html>
