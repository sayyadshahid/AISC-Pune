<!-- Q1. Write JS program to build a calculator using a switch statement that performs one of the following
operations: +, –, ×, ÷  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <input type="number" id="n1"> <br>
   <input type="number" id="n2"> 
    <input type="text" id="op" placeholder="+, -, *, /">

    <button onclick="submit()">calculate</button>

    <h1 id="result"></h1>

    <script>
        function submit(){
            let n1 = parseInt(document.getElementById("n1").value);
            let n2 = parseInt( document.getElementById("n2").value);
            let op = document.getElementById("op").value;
            let result = ""
            switch(op.trim()){
                case '+':
                    result = n1 + n2;
                    break;
                case '-':
                    result = n1 - n2;
                    break;
                case '*':
                    result = n1 * n2;
                    break;
                case '/': 
                    result = n1 / n2;
                    break;
                
                default:
                    result = "pls inter valid operator";

            }

            document.getElementById("result").innerHTML = result;
        }
    </script>
</body>

</html>
