<!-- Q2. Write JS program to create a list where clicking a button removes the last item using removeChild(). 										      [15]
 -->


 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <ul id="list">
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
        <li>item4</li>
    </ul>
    <button onclick="submit()">remove</button>
<script>

    function submit(){
        let con = document.getElementById("list");
        con.removeChild(
            con.lastElementChild
        )
    }
    </script>
 </body>
 </html>
