<!-- Q2. Write JS program to create a Shape class with a method area(). Inherit 
 from it to create a Rectangle class with width and height. [15] -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="calculate()">Calculate Area</button>

<p id="result"></p>

<script>

        class Shape{
             area (){
                return 0;
            }
        }

        class Rectangle extends Shape{
            constructor(width, height){
                super();
                this.width = width;
                this.height = height;
            }


            area(){
                return this.width * this.height;
            }
        }

        function calculate(){
            let p1 = new Rectangle(5, 6);
            document.getElementById("result").innerHTML = "area" + p1.area();
        }
</script>
</body>
</html>
