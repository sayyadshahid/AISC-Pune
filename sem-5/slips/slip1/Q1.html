<!-- Q1. Write JS program to accept string and check if it reads the same forward and backward using a
loop -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="str">
    <button onclick="submit()">submit</button>
    <h1 id="result"></h1>
    <script>
        function submit(){

            let input = document.getElementById("str").value;
            let reverse = "";
            
        for(let i = input.length -1 ; i >= 0; i--){
            reverse += input[i];
        }
        
        if(input.trim() === reverse){
            document.getElementById("result").innerHTML = "both are same";
            
        }else{
            document.getElementById("result").innerHTML = "not same";

        }
    }
    </script>
</body>
</html>
