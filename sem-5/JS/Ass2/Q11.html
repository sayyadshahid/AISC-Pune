<html lang="en">

<body>
    <h2>Stack and Queue Operations</h2>

<input type="text" id="inputValue"
       placeholder="Enter value">

<button onclick="pushStack()">Push (Stack)</button>
<button onclick="popStack()">Pop (Stack)</button>

<button onclick="enqueue()">Enqueue (Queue)</button>
<button onclick="dequeue()">Dequeue (Queue)</button>

<h3>Stack:</h3>
<p id="stackDisplay">[]</p>

<h3>Queue:</h3>
<p id="queueDisplay">[]</p>

<script>
let stack = [];
let queue = [];
function pushStack(){
    let input = document.getElementById("inputValue").value;
        stack.push(input);
        document.getElementById("stackDisplay").innerText = JSON.stringify(stack)
}

function popStack(){
    let input = document.getElementById("inputValue").value;
    if(input.length > 0){
        stack.pop()
        document.getElementById("stackDisplay").innerText = JSON.stringify(stack)

    }
}

</script>
</body>
