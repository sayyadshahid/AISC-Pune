<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>largest word</p>
    <input type="text"  id="word">
    <button onclick="findLargestWord()" >click</button>

    <p id="result"></p>
</body>

<script>
    function findLargestWord(){
        let sentence = document.getElementById("word").value;
        let words = sentence.split(" ");
        let largestWord = ""
        for(let i = 0; i < words.length; i++){
            if(words[i].length > largestWord.length){
                largestWord = words[i]
            }
        }


        document.getElementById("result").innerHTML = largestWord

    }
</script>
</html>
