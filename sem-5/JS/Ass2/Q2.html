<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>char counter</p>
    <input type="text" id="char">
    <button onClick="handleCharCounter()">submit</button>

    <p id="result"></p>
</body>

<script>

    function countCharecters(str){
        charCount = {}

        for(let i = 0; i < str.length; i++){
            let chat = str[i];
            if (charCount[chat]){
                charCount[chat]++;
            }else{
                charCount[chat] = 1;
            }
        }
        return charCount;
    }

    function handleCharCounter(){
       let input = document.getElementById("char").value;
        let count = countCharecters(input);
        let display = "";

        for (let key in count){
            display += `${key}: ${count[key]} \n`;
        }

        document.getElementById("result").innerHTML = display;
    }
</script>
</html>
