<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>title case</p>
    <input type="text" id="sen">
    <button onclick="titleCase()">submit</button>
    <p id="result"></p>
</body>
<script>
    function titleCase(){
        let input = document.getElementById("sen").value.toLowerCase();
        let words = input.split(" ");
        let result = "";

        for(let i =0; i < words.length; i++){
            result += words[i][0].toUpperCase() + words[i].substring(1) + " ";
        }

        document.getElementById("result").innerHTML = result;
    }
</script>
</html>
