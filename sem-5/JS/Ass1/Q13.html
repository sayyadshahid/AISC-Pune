<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="objshow()">click</button>
    <br>
    <hr>
    <p id="result"></p>

</body>

<script>
    function objshow(){
        const obj = {
            name: "shahid",
            age: 39
        }

        let count = 0;
        let result = "";

        for(let key in obj){
            count++;
            result += `${key}: ${obj[key]}\n`;
        }
        result += `\nTotal Properties: ${count}`;

    document.getElementById("result").innerText = result;
    }
</script>
</html>
