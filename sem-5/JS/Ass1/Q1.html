<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>age classifier</h3>
    <input id="age" type="number" placeholder="enter age">
    <button onClick="ageClassifier()">submit</button>

    <h1 id="result"></h1>
</body>
<script>
function ageClassifier(){
    age = parseInt(document.getElementById("age").value)

    if(age < 0){
        value = "enter valid age"
    }else if(age <= 12){
        value = "child";
    }else if(age <= 19){
        value = "teen";
    }else if(age <= 59){
        value = "adult";
    }else{
        value = "senior";
    }

    document.getElementById("result").innerHTML = value;

}



</script>
</html>
